domains:
- domain: ihg.com
  dnssec: false
  caa: []
  spf: true
  spf_record: >-
    v=spf1 include:_spf.ihg.com include:_spf.google.com include:amazonses.com
    include:spf.protection.outlook.com include:_spf.highradius.com
    ip4:148.163.135.129 ip4:216.133.255.190 ip4:147.154.153.87 ip4:138.1.67.161
    ip4:138.1.65.17 -all
  spf_qualifier: '-all'
  dmarc: true
  dmarc_policy: none
  dmarc_reporting: >-
    rua to dmarcian and Proofpoint Email Defense; ruf to Proofpoint. fo=1.
  note: >-
    SPF is well-formed and ends in a hard fail (-all), which is the strong
    choice. DMARC is published but p=none: reports are collected and acted on
    by two vendors, but no receiver is instructed to quarantine or reject
    spoofed IHG mail. For a brand whose loyalty programme is a standing
    phishing target, p=none is the weak link.
- domain: ihgplc.com
  dnssec: false
  caa: []
  spf: false
  dmarc: false
  note: >-
    The investor-relations domain publishes neither SPF nor DMARC. Any sender
    can spoof @ihgplc.com with no policy signal to receivers.

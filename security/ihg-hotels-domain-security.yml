generated: '2026-07-28'
method: probed
source: >-
  live DNS/TLS/HTTP probes of apis.yml hosts plus every IHG API and edge
  hostname found in review.yml. Baseline written by
  0-working/probe-domain-security.py, extended with the additional hosts and
  the ihgplc.com registrable domain. Probed 2026-07-28.
summary: >-
  TLS hygiene is uniformly good — every IHG host that answers negotiates
  TLS 1.3 with a valid certificate chain. Everything above the transport is
  weak or missing. www.ihg.com, the consumer booking site that carries payment
  and loyalty traffic, returns no HSTS header at all. The ihg.com DMARC record
  is published but set to p=none, which monitors spoofing rather than
  preventing it. Neither ihg.com nor ihgplc.com is DNSSEC-signed and neither
  publishes a CAA record, so nothing constrains which CA may issue for these
  domains. ihgplc.com — the investor-relations domain — publishes no SPF and no
  DMARC record of any kind.

disclosure_note: >-
  0-working/probe-security-programs.py returned vdp=none trust=none on
  2026-07-28. No /.well-known/security.txt on ihg.com (403 bot-block),
  ihgplc.com (404) or partnerconnect.ihg.com (404). trust.ihg.com and
  security.ihg.com do not resolve. No bug bounty programme on HackerOne,
  Bugcrowd or Intigriti was found. No named certification (SOC 2, ISO 27001,
  PCI DSS, HIPAA, FedRAMP) is published on any IHG property; the
  responsible-business policy library carries environmental, human-rights,
  community and supplier-code documents but no information-security policy.
  Because nothing was verified, no VulnerabilityDisclosure, Security,
  TrustCenter or Compliance pointer is wired into apis.yml.

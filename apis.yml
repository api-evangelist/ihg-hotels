name: IHG Hotels & Resorts
kind: company
description: >-
  InterContinental Hotels Group PLC (trading as IHG Hotels & Resorts) is a
  British asset-light hotel group headquartered at Windsor Dials, 1 Arthur Road,
  Windsor, Berkshire SL4 1RS, United Kingdom, with an Americas office at 3
  Ravinia Drive, Atlanta, Georgia. Its own corporate site states 7,014 hotels
  and 1,035,589 rooms across more than 100 countries, around 400,000 colleagues,
  20 brands and the IHG One Rewards loyalty programme (figures read from
  ihgplc.com on 2026-07-28). The brand portfolio spans Six Senses, Regent,
  InterContinental, Vignette Collection, Kimpton, Hotel Indigo, voco, HUALUXE,
  Crowne Plaza, EVEN Hotels, Holiday Inn, Holiday Inn Express, Holiday Inn
  Resorts, Holiday Inn Club Vacations, Garner, avid, Atwell Suites, Staybridge
  Suites, Candlewood Suites, IHG Army Hotels and Iberostar Beachfront Resorts.
  In the distribution chain IHG sits on the supply side as a franchisor and
  manager rather than an owner: it aggregates independently owned and operated
  properties into a single central reservation system and pushes that inventory
  out through its own ihg.com and app direct channels, through the three GDSs
  and their agency terminals, through OTAs and wholesalers, and through
  corporate and group channels. Critically, IHG does not run its own reservation
  platform any more. It announced a partnership with Amadeus in 2015 to build a
  cloud Guest Reservation System to replace HOLIDEX, its proprietary system in
  service since 1965, and migrated onto it across 2018 and early 2019 — so the
  hotel group most likely to be a lock-in vendor is itself a customer of a GDS
  company's platform, and group bookings land in Amadeus Delphi and Meeting
  Broker. Its API posture, stated honestly, is gated and undocumented. There is
  no live developer portal. The one that existed — PartnerConnect RoomService at
  pcroomservice.ihg.com, a TIBCO Mashery portal publishing five rate,
  availability and hotel-content APIs — is decommissioned: the hostname is
  NXDOMAIN on Google, Cloudflare and Quad9 resolvers as of 2026-07-28 and the
  Internet Archive holds no page capture after 2019. What remains live is
  partnerconnect.ihg.com (HTTP 200), an affiliate marketing programme whose
  signup routes to Commission Junction and which still advertises "access to
  real-time hotel rates, availability and hotel content API's" without linking
  to any technical resource. Real API hostnames exist — api.ihg.com CNAMEs to
  ihg.api.mashery.com with an sb-ihg.mashery.com sandbox, and apis.ihg.com,
  b2b.ihg.com, mcp.ihg.com, booking.ihg.com and concerto.ihg.com all sit behind
  Akamai — but every one returns 403 Access Denied or 401 on every path probed,
  including /openapi.json, /swagger.json, /api-docs and /.well-known/. No
  OpenAPI, Swagger, AsyncAPI, GraphQL SDL, WSDL, XSD, OpenTravel/OTA or HTNG
  reference is published anywhere by IHG. apis[] is deliberately empty: listing
  an Akamai-gated hostname or a decommissioned 2017 portal as a live API would
  be fabrication. The value of this record is the switchingCost block in
  review.yml, which captures what published IHG documents actually say about
  what it costs to leave — including the archived RoomService Terms of Use
  classing "API parameters" as Confidential Information and binding partners to
  the Master PartnerConnect Terms and Conditions plus the Six Continents Hotels
  E-commerce Master Service Agreement, and the current IHG One Rewards member
  terms stating that members whose accounts are cancelled "by IHG or by the
  Member, will forfeit all Points, Point vouchers, Reward Nights, and any other
  benefits associated with the account".

summary: >-
  IHG publishes no client library for any API, in any language. There is no
  first-party SDK, no CLI binary and no corporate npm/PyPI/Maven/NuGet/RubyGems
  organisation. This is expected: IHG publishes no API to build an SDK against.
  What the registries do contain is three unrelated classes of package, all
  recorded below and none of them an IHG API client, so NO `SDKs` pointer is
  wired into apis.yml — doing so would credit IHG with an SDK surface it does
  not have.

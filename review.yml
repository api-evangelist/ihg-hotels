    note: Real gateways exist (api.ihg.com via Mashery, apis.ihg.com via Akamai) but
      no protocol, base URL, operation, schema or authentication scheme is published.
  - protocol: SOAP/XML
    documented: false
    note: No WSDL or XSD published. The retired RoomService API names echo OpenTravel
      OTA message shapes but no schema was ever published publicly.
  - protocol: WebSocket
    documented: false
    note: None documented.
  - protocol: GraphQL
    documented: false
    note: None documented.
  authModel:
    documented: false
    note: >-
      The retired RoomService portal issued Mashery-style API keys through a
      "My API's" page with separate staging and production keys. Nothing about
      authentication is published today. No OAuth metadata, no
      /.well-known/openid-configuration, no scopes.

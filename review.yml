actions:
  apisYmlUpdated: true
  openapiHarvested: false
  specsSaved: 0
  reason: >-
    Recorded as an honest stub with a full switching-cost record. IHG operates
    real, production APIs — a Mashery gateway still in DNS at api.ihg.com, five
    Akamai-fronted hostnames, and a live partner integration hubli announced
    across 6,600+ properties — but publishes no developer portal, no reference
    documentation, no machine-readable specification, no authentication
    metadata and no webhook catalogue. apis[] is intentionally empty: listing
    an Akamai-gated hostname or a decommissioned 2017 Mashery portal as a live
    API would be fabrication. openapi/ is omitted because nothing real was
    harvested. The value of this record is threefold: it documents an API
    programme that went BACKWARDS (a public self-registration developer portal
    in 2015, nothing at all in 2026); it preserves the actual text of an API
    terms-of-use that classed "API parameters" as Confidential Information and
    imposed volume commitments; and it captures the sector inversion — the
    hotel group that imposes switching cost on guests and affiliates is itself
    locked into a GDS company's reservation platform.

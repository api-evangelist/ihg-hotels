aid: ihg-hotels
name: IHG Hotels & Resorts
review:
  question: Does IHG Hotels & Resorts publish a public, self-serve developer portal
    or downloadable API specifications, and what would it cost a partner or a guest
    to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: hotel-group
  gated: true
findings:
  summary: |
    InterContinental Hotels Group PLC (IHG Hotels & Resorts) publishes NO
    developer portal, NO API reference documentation and NO machine-readable
    API contract of any kind as of 2026-07-28.

    The interesting fact is that it USED to. PartnerConnect RoomService at
    pcroomservice.ihg.com was a real, public, TIBCO Mashery developer portal
    with a registration flow, an API key console ("My API's"), an I/O Docs
    interactive console, an API gallery, a support forum and a published
    Commercial API Terms of Use. It documented five APIs by name: Hotel
    Descriptive Info, Single Property Availability, Rate Range (AREA
    availability), Hotel Search, and Single Property Availability with Rate
    Rules. That portal is gone. pcroomservice.ihg.com is NXDOMAIN on Google
    (8.8.8.8), Cloudflare (1.1.1.1) and Quad9 (9.9.9.9) resolvers; curl exits
    6 (could not resolve host); the Internet Archive holds page captures only
    through 2017 and asset captures only through early 2019. Search engines
    still index the portal and still describe it as operational — that index
    is stale, and this record deliberately contradicts it on the strength of
    a direct probe.

    What is still live is partnerconnect.ihg.com (HTTP 200, WordPress 5.2.24).
    It is an AFFILIATE MARKETING programme, not a developer portal. Its own
    copy still advertises "PartnerConnect RoomService" giving "access to
    real-time hotel rates, availability and hotel content API's", but the page
    contains no link to any technical resource, no API documentation, no
    endpoint and no key request. Every signup link on the page points at
    Commission Junction (signup.cj.com publisher signup, regional cids
    1675692, 4381309, 4386835, 4390377). The linked FAQ PDF is dated 2017 and
    describes a commission programme, not an API.

    Real API infrastructure demonstrably exists behind Akamai and Mashery.
    api.ihg.com CNAMEs to ihg.api.mashery.com with an sb-ihg.mashery.com
    sandbox in the chain — the Mashery gateway that fronted RoomService is
    still in DNS even though the portal is not. apis.ihg.com, b2b.ihg.com,
    mcp.ihg.com, booking.ihg.com and status.ihg.com all resolve to Akamai
    edgekey and answer 403 Access Denied on every path probed.
    concerto.ihg.com (IHG Concerto, the internal hotel operating platform)
    resolves to prod-internal.ihg.edgekey.net and answers 401 at /hin/. None
    of these are documented and none are listed as APIs here.

    The distribution finding is the sector-relevant one, and it inverts the
    usual reading. IHG is a hotel group large enough to be the lock-in vendor,
    and in the guest relationship it is. But in its own supply chain it is the
    LOCKED-IN party: it retired HOLIDEX, the proprietary reservation system
    Holiday Inn had run since 1965, and moved onto a cloud Guest Reservation
    System co-developed with Amadeus (announced 2015, rolled out across 2018
    and early 2019). Group and meetings bookings land in Amadeus Delphi and
    Meeting Broker. The hotel group's central reservation platform is a GDS
    company's product.

    No official IHG GitHub organisation was found. No IHG entry exists in
    APIs.guru. No IHG specification was found on SwaggerHub. No IHG provider
    record existed in the APIs.io catalogue before this one.

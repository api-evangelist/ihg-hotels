summary: >-
  IHG publishes no /.well-known/ discovery surface on any host. Every probe
  below was run on 2026-07-28 with a browser User-Agent against the eight IHG
  hostnames that resolve. Not one document was returned. The API-bearing hosts
  (apis.ihg.com, dev-apis.ihg.com, mcp.ihg.com, booking.ihg.com) sit behind
  Akamai and answer 403 Access Denied to every path including /.well-known/;
  concerto.ihg.com answers 401; the two hosts that will actually serve content
  (partnerconnect.ihg.com, www.ihgplc.com) answer 404. No security.txt, no
  OpenID Connect discovery document, no RFC 8414 authorization-server metadata,
  no RFC 9727 api-catalog and no ai-plugin.json exists anywhere on ihg.com or
  ihgplc.com. A 403 here means "edge rule blocked the request", not "the
  document is absent" — but the practical result for any consumer, human or
  agent, is identical: nothing is discoverable.

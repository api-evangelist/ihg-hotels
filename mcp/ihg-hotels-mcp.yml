summary: 'IHG publishes no Model Context Protocol server. No first-party MCP endpoint, no manifest, no
  tool list and no OAuth protected-resource metadata exists at any IHG hostname. No `MCPServer` pointer
  is wired into apis.yml, because wiring one would credit IHG with an agent surface it does not operate.
  No candidate tool list can be derived either: the derivation input is an OpenAPI document, and IHG publishes
  none (see well-known/ihg-hotels-well-known.yml).'

hostname_note: mcp.ihg.com resolves to mcp.ihg.edgekey.net and is real, but its purpose is undocumented
  and is NOT assumed to be Model Context Protocol. In IHG's estate the initials plausibly stand for something
  else entirely (a marketing or content platform). Every JSON-RPC and well-known probe returns Akamai
  "Access Denied", so nothing can be asserted about it. Recording it as an MCP server on the strength
  of the hostname alone would be fabrication.

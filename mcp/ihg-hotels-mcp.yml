  note: A third-party MCP server that gives an agent IHG hotel search and booking by driving ihg.com in
    a headless browser. It exists because there is no IHG API to call. It is not an IHG interface, carries
    no IHG endorsement, and is listed here as market evidence only — the agent-era demand for IHG inventory
    is real and is currently being served by scraping.
agent_readiness_note: For an agent, IHG is closed. There is no MCP server, no OpenAPI to forge tools from,
  no llms.txt on www.ihg.com (403), no /.well-known/ discovery of any kind, and no documented authentication.
  The only programmatic routes to IHG inventory an agent can actually take are through third parties —
  Amadeus, Sabre, Travelport, Expedia Rapid, the Booking.com Demand API and the bedbanks — or through
  browser automation of ihg.com.
